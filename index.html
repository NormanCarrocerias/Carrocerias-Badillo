<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrocerías Badillo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <h2>Carrocerías Badillo</h2>
  </div>

  <!-- HERO -->
  <section class="hero">
    <h1 class="typewriter">Bienvenido a Carrocerías Badillo</h1>
  </section>

  <!-- SECTIONS -->
  <section class="section">
    <h2>Servicios</h2>
    <div class="card">Carrocerías personalizadas</div>
    <div class="card">Reparaciones</div>
    <div class="card">Pintura</div>
  </section>

  <section class="section">
    <h2>Contacto</h2>
    <form>
      <input type="text" placeholder="Nombre"><br><br>
      <input type="email" placeholder="Correo"><br><br>
      <textarea placeholder="Mensaje"></textarea><br><br>
      <button type="submit">Enviar</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Carrocerías Badillo</p>
    <div class="social-icons">
      <a href="#"><img src="imagenes/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="imagenes/facebook.png" alt="Facebook"></a>
      <a href="#"><img src="imagenes/twitter.png" alt="Twitter"></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

}
